<!DOCTYPE html>
<html lang="en">

  <head>
    <title>Gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://cdn.discordapp.com/emojis/801499706625622046.webp?quality=lossless">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="header" style="position: fixed; z-index: 6; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);">
      <img src="https://cdn.discordapp.com/emojis/801499706625622046.webp?quality=lossless" alt="icon" width="32" height="32" style="margin-left: 20%;">
      <h1 style="margin-left: 15px;">Abdomera's Mod Gallery</h1>
      <h3 style="display: none;">Gallery for my League of Legends mods</h3>
    </div>

    <div id="grid"></div>

    <div id="product-popup" class="popup">
      <div class="popup-body" style="padding-bottom: 0px;">
        <img id="product-image" src=https://www.w3schools.com/w3images/nature.jpg>
        <div style="width: 50%; height: 100%; float: left;">
          <h2 id="product-name" style="text-align: center;">Product Name</h2>
          <h3 id="product-description" style="margin: 5%">Description</h3>
          <div class="price-tag" id="product-price" style="scale: 2; bottom: 20px; right: 44px;">$</div>
        </div>
      </div>
      <div class="close-button">x</div>
    </div>

    <div id="footer"><a href="https://discord.gg/leagueskinsnsfw" target="_blank">Discord</a></div>

  </body>

</html>
